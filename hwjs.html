<style>
        body {
            overflow: hidden;
            background-color: black;
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #666666; }
        ::-webkit-scrollbar-thumb { background: #CCCCCC; }
        ::-webkit-scrollbar-thumb:hover { background: #CCCCCC; }
        html { scrollbar-color: #CCCCCC #666666; scrollbar-width: thin; background-color: black; }


        #hw-intro {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
            background: url('assets/freeze frame.png') center center / cover no-repeat black;
            filter: grayscale(100%);
            transition: opacity 1s ease;
        }
        #hw-intro.hidden {
            opacity: 0;
        }
        #hw-intro-text {
            color: #ffffff;
            font-size: 22px;
            font-family: Arial, sans-serif;
            letter-spacing: 3px;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 2px 6px rgba(0,0,0,0.9);
            filter: none;
            animation: hw-pulse 2s ease-in-out infinite;
        }
        @keyframes hw-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

    </style>
</head>
<body oncontextmenu="return false;">
<script>
        function get_url_parameter(sParam) {
            var sPageURL = window.parent.location.search.substring(1),
                sURLVariables = sPageURL.split("&"),
                sParameterName,
                i;

            for (i = 0; i < sURLVariables.length; i++) {
                sParameterName = sURLVariables[i].split("=");

                if (sParameterName[0] === sParam) {
                    return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
                }
            }
        };


        function report_loading_issue() {
            var el = document.createElement("img");
            el.src = "/DEBUG2/wrong-ref.png?wl=" + window.location + "&wpl=" + window.parent.location + "&wlh=" + window.location.host + "&wplh=" + window.parent.location.host;
            el.style.position = "absolute";
            el.style.left = "-9999px";
            el.style.top = "-9999px";
            document.body.appendChild(el);

            el.onerror = function() {
                while(true) {
                    eval("debugger");
                }
            }
        }

            var _launch = window.HW_LAUNCH || {};
            var _resMap = { '1280x720':1, '1280x800':1, '1920x1080':1, '2560x1440':1.5, '3840x2160':2 };
            var _hwRes  = _resMap[_launch.resolution] || 1;
            var _hwFps  = (parseInt(_launch.fps) > 0) ? parseInt(_launch.fps) : 60;  // 60 = native speed

            window["HW_SETTINGS"] = {
                fps: _hwFps,
                resolution: _hwRes,
                resolutionFullscreen: _hwRes * 2,

            if(false) {

            } else {
                // Set variables
                if(!isNaN(get_url_parameter("replay_id"))) {
                    window["HW_SETTINGS"]["replay_id"] = get_url_parameter("replay_id");
                }
                if(!isNaN(get_url_parameter("level_id"))) {

                    i_el.src = "js/index.aef1185ca2166a2790af1034e27f4c80.js";

<div id="og-game-holder"></div>

<div id="hw-intro">
  <span id="hw-intro-text">please wait while we load...</span>
</div>

<script>
  (function () {
    var holder = document.getElementById('og-game-holder')
    var intro  = document.getElementById('hw-intro')

    function onReady() {
      intro.classList.add('hidden')
      setTimeout(function () { intro.remove() }, 900)

      setTimeout(function () {
        holder.classList.remove('hw-loading')
        var canvas = document.querySelector('canvas')
        if (canvas) canvas.focus()
      }, 400)
    }

    // Poll until PIXI stage has named children (main menu is up)
    // Fallback: always clear after 10s no matter what
    var fallback = setTimeout(function () {
      clearInterval(poll)
      onReady()
    }, 10000)

    var poll = setInterval(function () {
      var app = window.__PIXI_APP__ || window.app
      if (!app || !app.stage) return
      if ((app.stage.children || []).length > 0) {
        clearInterval(poll)
        clearTimeout(fallback)

        setTimeout(onReady, 5000)
      }
    }, 250)
  })()
</script>
</body>
